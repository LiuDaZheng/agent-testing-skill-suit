name: Auto-Fix CI Issues

on:
  workflow_run:
    workflows: ["CI/CD - Skill Quality Validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          pip install yamllint
          npm install -g markdownlint-cli

      - name: Get failure details
        id: failures
        run: |
          echo "🔍 Analyzing failures..."
          echo "fix_yaml=false" >> $GITHUB_OUTPUT
          echo "fix_md=false" >> $GITHUB_OUTPUT
          
          # Check for YAML errors
          if gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} 2>&1 | grep -q "yamllint\|YAML\|commas"; then
            echo "fix_yaml=true" >> $GITHUB_OUTPUT
            echo "✅ Detected YAML issues"
          fi
          
          # Check for Markdown errors
          if gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} 2>&1 | grep -q "markdownlint\|MD0\|Markdown"; then
            echo "fix_md=true" >> $GITHUB_OUTPUT
            echo "✅ Detected Markdown issues"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix YAML formatting
        if: steps.failures.outputs.fix_yaml == 'true'
        run: |
          echo "🔧 Fixing YAML formatting..."
          find src/skills -name "SKILL.md" -type f | while read file; do
            # Fix metadata YAML frontmatter
            sed -i 's/bins:\[wc\]/bins: [ wc ]/g' "$file"
            sed -i 's/bins:\[ wc\]/bins: [ wc ]/g' "$file"
            sed -i 's/os:\[darwin,linux\]/os: [ darwin, linux ]/g' "$file"
            sed -i 's/os:\[darwin, linux\]/os: [ darwin, linux ]/g' "$file"
            sed -i 's/os: \[darwin, linux\]/os: [ darwin, linux ]/g' "$file"
          done
          echo "✅ YAML fixed"

      - name: Fix Markdown formatting
        if: steps.failures.outputs.fix_md == 'true'
        run: |
          echo "🔧 Fixing Markdown formatting..."
          find src/skills -name "SKILL.md" -type f | while read file; do
            # Fix MD031: Add blank lines around code blocks
            # This is a simple fix - add blank line before ``` if missing
            awk '
              /^```/ {
                if (NR > 1 && prev != "") {
                  print ""
                }
              }
              { print }
              { prev = $0 }
            ' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
            
            # Remove trailing whitespace
            sed -i 's/[[:space:]]*$//' "$file"
          done
          echo "✅ Markdown fixed"

      - name: Check for changes
        id: git-check
        run: |
          if ! git diff --quiet; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⚠️ No changes to commit"
          fi

      - name: Commit and push
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/skills/
          git commit -m "bot: auto-fix CI/CD issues [skip ci]"
          git push --force-with-lease
          echo "✅ Changes pushed"

      - name: Comment on PR
        if: steps.git-check.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.workflow_run.pull_requests[0];
            if (pr && pr.number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `## 🤖 Auto-Fix Applied\n\nCommon CI/CD issues have been automatically fixed:\n- ✅ YAML formatting\n- ✅ Markdown formatting\n\nCI will automatically re-run. Please wait a moment...`
              });
            }

      - name: Restart CI workflow
        if: steps.git-check.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const workflow_name = 'CI/CD - Skill Quality Validation';
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const workflow = workflows.data.workflows.find(w => w.name === workflow_name);
            if (workflow) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                ref: '${{ github.event.workflow_run.head_branch }}'
              });
              console.log('✅ CI workflow restarted');
            }
