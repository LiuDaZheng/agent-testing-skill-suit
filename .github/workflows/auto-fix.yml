name: Auto-Fix CI Errors

on:
  workflow_run:
    workflows: ["CI/CD - Skill Quality Validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-fix YAML spacing
        run: |
          echo "🔧 Fixing YAML spacing issues..."
          find src/skills -name "SKILL.md" -type f | while read file; do
            # Fix [wc] -> [ wc ]
            sed -i 's/\[wc\]/[ wc ]/g' "$file"
            # Fix [darwin,linux] -> [ darwin, linux ]
            sed -i 's/\[\([^]]*\),\([^]]*\)\]/[ \1, \2 ]/g' "$file"
          done
          echo "✅ YAML fixed"

      - name: Check for changes
        id: git-check
        run: |
          if ! git diff --quiet; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/skills/
          git commit -m "bot: auto-fix YAML formatting [skip ci]"
          git push

      - name: Comment on PR
        if: steps.git-check.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.workflow_run.pull_requests[0];
            if (pr && pr.number) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: '🤖 **Auto-Fix Applied**\n\nFixed YAML formatting issues automatically. CI will re-run.'
              });
            }
