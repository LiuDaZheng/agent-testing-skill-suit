name: Auto-Fix CI/CD Errors

on:
  workflow_run:
    workflows: ["CI/CD - Skill Quality Validation"]
    types:
      - completed

jobs:
  auto-fix:
    name: Auto-Fix Common Issues
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          pip install yamllint
          npm install -g markdownlint-cli

      - name: Auto-fix YAML formatting
        run: |
          echo "🔧 Auto-fixing YAML formatting issues..."
          find src/skills -name "SKILL.md" | while read file; do
            # Fix YAML array spacing (add spaces after commas)
            sed -i 's/\[wc\]/[ wc ]/g' "$file"
            sed -i 's/\[\([^,]*\),\([^]]*\)\]/[ \1, \2 ]/g' "$file"
          done
          echo "✅ YAML formatting fixed"

      - name: Auto-fix Markdown issues
        run: |
          echo "🔧 Auto-fixing Markdown issues..."
          find src/skills -name "SKILL.md" | while read file; do
            # Remove trailing whitespace
            sed -i 's/[[:space:]]*$//' "$file"
            # Ensure single newline at end of file
            sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$file"
            echo "" >> "$file"
          done
          echo "✅ Markdown issues fixed"

      - name: Check if fixes were applied
        id: check-fixes
        run: |
          if ! git diff --quiet; then
            echo "fixes_applied=true" >> $GITHUB_OUTPUT
            echo "✅ Fixes were applied"
          else
            echo "fixes_applied=false" >> $GITHUB_OUTPUT
            echo "⚠️ No fixes were applied"
          fi

      - name: Commit and push fixes
        if: steps.check-fixes.outputs.fixes_applied == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/skills/
          git commit -m "bot: auto-fix CI/CD validation errors [skip ci]"
          git push

      - name: Comment on PR
        if: steps.check-fixes.outputs.fixes_applied == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.workflow_run.pull_requests[0]?.number;
            if (prNumber) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '🤖 **Auto-Fix Applied**\n\nCommon CI/CD issues have been automatically fixed:\n- YAML formatting (spaces after commas)\n- Markdown formatting (trailing whitespace)\n\nPlease check the latest commit for details.'
              });
            }

      - name: Upload fix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-fix-report
          path: |
            src/skills/
