name: Auto-Fix YAML Issues

on:
  push:
    branches: [feature/disclaimer-and-docs]

permissions:
  contents: write

jobs:
  fix-yaml:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix YAML spacing
        run: |
          echo "🔧 Fixing YAML..."
          find src/skills -name "SKILL.md" | while read file; do
            sed -i 's/\[wc\]/[ wc ]/g' "$file"
            sed -i 's/\[darwin\]/[ darwin ]/g' "$file"
            sed -i 's/\[linux\]/[ linux ]/g' "$file"
            sed -i 's/\[\([^,]*\),\([^]]*\)\]/[ \1, \2 ]/g' "$file"
          done

      - name: Check changes
        id: check
        run: |
          if ! git diff --quiet; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/skills/
          git commit -m "bot: fix YAML [skip ci]" || echo "No changes"
          git push || echo "Push failed"
